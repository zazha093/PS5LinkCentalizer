<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<title>PS5 Links</title>
<link rel="stylesheet" href="style.css">
<base target="_blank">
</head>
<body>
<main>
  <header class="top">
    <h1>PS5 Links</h1>
    <p>PS5 scene projects · Updated automatically · <a href="https://github.com/pedrohti/PS5LinkCentalizer#add-a-project">Add a project</a> · <a href="offline.html" target="_self">Offline</a></p>
  </header>
  <div class="searchbar">
    <input id="q" type="search" placeholder="Search projects, categories..." aria-label="Search" enterkeyhint="search">
  </div>

  <!-- Stats Bar -->
  <section class="stats" id="stats">
    <div class="stat"><span class="stat-num" id="stat-total">—</span><span class="stat-label">Projects</span></div>
    <div class="stat"><span class="stat-num" id="stat-cats">—</span><span class="stat-label">Categories</span></div>
    <div class="stat"><span class="stat-num" id="stat-stable">—</span><span class="stat-label">Stable</span></div>
    <div class="stat"><span class="stat-num" id="stat-pre">—</span><span class="stat-label">Beta</span></div>
  </section>

  <!-- Sort Bar -->
  <section class="sortbar" id="sortbar">
    <span class="sort-label">Sort by:</span>
    <button class="sortbtn" data-key="name">Name ↕</button>
    <button class="sortbtn" data-key="stars">Stars ↕</button>
    <button class="sortbtn" data-key="category">Category ↕</button>
    <button class="sortbtn" data-key="stable">Stable ↕</button>
